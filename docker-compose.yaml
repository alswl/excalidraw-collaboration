# Deployment entry point for managed hosting platforms.
# Keep this configuration aligned with basic/docker-compose.yaml.
services:
  frontend:
    image: alswl/excalidraw:v0.18.1-fork-b2
    environment:
      - VITE_APP_BACKEND_V2_GET_URL=http://127.0.0.1:8081/api/v2/scenes/
      - VITE_APP_BACKEND_V2_POST_URL=http://127.0.0.1:8081/api/v2/scenes/
      - VITE_APP_WS_SERVER_URL=http://127.0.0.1:8082
      - VITE_APP_FIREBASE_CONFIG={}
      - VITE_APP_HTTP_STORAGE_BACKEND_URL=http://127.0.0.1:8081/api/v2
      - VITE_APP_STORAGE_BACKEND=http
    ports:
      - 80:80

  storage:
    image: alswl/excalidraw-storage-backend:v2023.11.11
    restart: always
    environment:
      - PORT=8081
    ports:
      - 8081:8081

  room:
    image: alswl/excalidraw-room-go:latest
    environment:
      - PORT=80
    ports:
      - 8082:80
